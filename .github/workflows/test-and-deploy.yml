name: CI/CD Pipeline

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  # Job 1: Run Python Tests
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e src/psdtosvg/[test]

      - name: Run Python tests
        run: |
          cd src/psdtosvg
          pytest

  # Job 2: Test, Build, and Deploy Frontend
  frontend-ci-cd:
    runs-on: ubuntu-latest
    needs: python-tests # Ensures Python tests pass before running this job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/with-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend tests
        run: |
          cd frontend
          npm test -- --watchAll=false # Prevents watch mode from hanging the CI

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages